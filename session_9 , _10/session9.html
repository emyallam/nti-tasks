<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session 9</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/session9.css">
</head>

<body>

    <section id="landing">
        <div id="carouselExampleRide" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">

                <div class="carousel-item active">
                    <div class="carousel-content">
                        <h1>We Build <br>Great Brands.</h1>
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="carousel-content">
                        <h1>Focused <br>on Strategy.</h1>
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="carousel-content">
                        <h1>Advanced in <br>digital works.</h1>
                    </div>
                </div>

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleRide"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleRide"
                data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </section>

    <section id="contact" class="py-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="content-left">
                        <h3>Get answers and advices from professional consultants.</h3>
                        <ul class="list-unstyled mt-4">
                            <li class="md-3 pb-2 border-buttom">
                                <div class="contact-info d-flex align-items-center">
                                    <i class="fa-regular fa-map"></i>
                                    <div class="contact-info-right">
                                        <h5>Address</h5>
                                        <p>1650 Lombard Street, San Francisco, CA 94123</p>
                                    </div>
                                </div>
                            </li class="md-3 pb-2 border-buttom">
                            <li>
                                <div class="contact-info d-flex align-items-center">
                                    <i class="fa-solid fa-mobile-button"></i>
                                    <div class="contact-info-right">
                                        <h5>Phone</h5>
                                        <p>+1 (415) 876-3250 / +1 (415) 876-3251</p>
                                    </div>
                                </div>
                            </li>
                            <li>
                                <div class="contact-info d-flex align-items-center">
                                    <i class="fa-solid fa-envelope"></i>
                                    <div class="contact-info-right">
                                        <h5>Message</h5>
                                        <p><a href="#">[Email Protected]</a></p>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="content-right">
                        <form action="">
                            <input type="text" class="form-control mb-3 rounded-0" placeholder="Name..">
                            <input type="text" class="form-control mb-3 rounded-0"  placeholder="Email..">
                            <input type="text" class="form-control mb-3 rounded-0"  placeholder="phone">
                            <textarea class="form-control mb-3 rounded-0" placeholder="message.." ></textarea>
                            <button class="btn btn-danger text-white rounded-0"> <i class="fa-regular fa-paper-plane"></i>message</button>

                        </form>
                    </div>
                </div>


            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>

</html>
