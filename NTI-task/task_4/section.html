<html>

<head>
  <link rel="stylesheet" href="section.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <section class="pricing-section">
    <header class="display-header">
      <h1 class="display-flex justify-center">Our Pricing Plans</h1>
      <p class="display-flex justify-center">Choose the plan that best suits your needs.</p>
    </header>
    <div class="pricing-cards">
      <div class="pricing-card basic">
        <div class="card-header">Basic</div>
        <div class="card-price"><span class="currency">$</span>19<span class="per">/mo</span></div>
        <ul class="features">
          <li><i class="fa fa-check"></i> 10 Projects</li>
          <li><i class="fa fa-check"></i> 5 GB Storage</li>
          <li><i class="fa fa-check"></i> Basic Support</li>
        </ul>
        <button class="card-btn basic-btn">Get Started</button>
      </div>
      <div class="pricing-card standard">
        <div class="most-popular">Most Popular</div>
        <div class="card-header">Standard</div>
        <div class="card-price"><span class="currency">$</span>39<span class="per">/mo</span></div>
        <ul class="features">
          <li><i class="fa fa-check"></i> 50 Projects</li>
          <li><i class="fa fa-check"></i> 25 GB Storage</li>
          <li><i class="fa fa-check"></i> Priority Support</li>
        </ul>
        <button class="card-btn standard-btn">Get Started</button>
      </div>
      <div class="pricing-card premium">
        <div class="card-header">Premium</div>
        <div class="card-price"><span class="currency">$</span>59<span class="per">/mo</span></div>
        <ul class="features">
          <li><i class="fa fa-check"></i> Unlimited Projects</li>
          <li><i class="fa fa-check"></i> 100 GB Storage</li>
          <li><i class="fa fa-check"></i> 24/7 Support</li>
        </ul>
        <button class="card-btn premium-btn">Get Started</button>
      </div>
    </div>
  </section>
</body>

</html>
